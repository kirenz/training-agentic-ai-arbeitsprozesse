project:
  type: website
  output-dir: _site
  resources:
    - material/**
  render:
    - index.qmd
    - tage/montag.qmd
    - tage/dienstag.qmd
    - werkzeuge/einrichtung.qmd
    - werkzeuge/prozessmodell.qmd
    - projekt.qmd
    - materialien.qmd

lang: de

website:
  title: "Agentic AI: Optimierung von Arbeitsprozessen"
  description: "Blocktage und Semesterprojekt mit Mercedes-Benz, HdM Stuttgart WS 2026/27"
  page-navigation: true
  search:
    type: overlay
  navbar:
    background: light
    pinned: true
    left:
      - href: index.qmd
        text: Start
      - text: Blocktage
        menu:
          - href: tage/montag.qmd
            text: "Montag, 28.09."
          - href: tage/dienstag.qmd
            text: "Dienstag, 29.09."
      - text: Werkzeugkasten
        menu:
          - href: werkzeuge/einrichtung.qmd
            text: Einrichtung
          - href: werkzeuge/prozessmodell.qmd
            text: Prozessmodellierung
      - href: projekt.qmd
        text: Semesterprojekt
      - href: materialien.qmd
        text: Materialien
  page-footer:
    border: true
    left: |
      © [Jan Kirenz](https://www.kirenz.com/), 2026
    right: "HdM Stuttgart, Interdisziplinäres Projekt WS 2026/27"

format:
  html:
    toc: true
    toc-title: "Auf dieser Seite"
    toc-depth: 2
    link-external-newwindow: true
    theme:
      - cosmo
      - book-theme.scss
      - website-extras.scss
    code-copy: true
    highlight-style: github
    code-overflow: wrap
    author-meta: "Jan Kirenz"
    callout-appearance: simple
    smooth-scroll: true
    anchor-sections: true
    include-in-header:
      - passwortschutz.html
